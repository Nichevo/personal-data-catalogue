[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdcat"
version = "0.1.0"
description = "A personal, local data catalogue for SQL Server tables and Python projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.46",
    "pandas>=2.0",
    "pyodbc>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdcat = "pdcat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
