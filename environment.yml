# Conda environment for the personal data catalogue.
#   conda env create -f environment.yml
#   conda activate pdcat
#   pip install -e . --no-deps
name: pdcat
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - streamlit>=1.62
  - pandas>=2.0
  - pyarrow>=14
  - pyodbc>=5.0
  - pyyaml>=6
  - pytest>=8
  - ruff>=0.5
  # Optional readers for Power BI .pbix models and Excel macros
  - olefile
  # Optional (2.1): exact SQL reading, and text from PDF reference documents.
  # The app works without them; each feature falls back or says what to install.
  - sqlglot>=25
  - pypdf
  - pip:
      - pbixray
      # Access databases on Windows (DAO); skipped on other systems
      - pywin32; sys_platform == "win32"
